name: e_learning_app
description: "A new Flutter project."
publish_to: "none"

version: 1.1.1+2

environment:
  sdk: ^3.6.1

dependencies:
  cached_network_image: ^3.4.1
  chewie: ^1.12.1
  country_code_picker: ^3.3.0
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  envied: ^1.1.1
  firebase_core: ^4.2.0
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.0
  flutter_widget_from_html: ^0.17.0
  freezed: ^3.1.0
  freezed_annotation: ^3.1.0
  get_it: ^8.0.3
  google_fonts: ^6.3.1
  google_nav_bar: ^5.0.7
  google_sign_in: ^7.1.1
  groq: ^1.0.0
  http_parser: ^4.1.2
  iconsax: ^0.0.8
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  json_serializable: ^6.9.5
  percent_indicator: ^4.2.5
  restart_app: ^1.3.2
  retrofit: ^4.7.1
  retrofit_generator: ^10.0.1
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  video_player: ^2.10.0
  webview_flutter: ^4.13.0

dev_dependencies:
  build_runner: ^2.6.0
  pretty_dio_logger: ^1.4.0
  envied_generator: ^1.1.1
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.4.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  vector_math: ^2.2.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/svgs/onboarding/
    - assets/svgs/auth/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
flutter_intl:
  enabled: true
